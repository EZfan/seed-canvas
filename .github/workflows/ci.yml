name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
      - name: clippy (workspace)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: clippy (examples)
        run: cargo clippy --examples --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      - name: cargo test
        run: cargo test --workspace --locked --all-targets

  determinism:
    name: determinism (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: determinism
      - name: golden PNG hash
        run: |
          set -euo pipefail
          cargo run --quiet --bin galaxy -- --seed cosmos --out /tmp/cosmos.png --format png
          echo "$(sha256sum /tmp/cosmos.png | awk '{print $1}') cosmos" > "$RUNNER_TEMP/golden.txt"
          cat "$RUNNER_TEMP/golden.txt"
      - name: golden SVG hash
        run: |
          set -euo pipefail
          cargo run --quiet --bin galaxy -- --seed cosmos --out /tmp/cosmos.svg --format svg
          echo "$(sha256sum /tmp/cosmos.svg | awk '{print $1}') cosmos.svg" >> "$RUNNER_TEMP/golden.txt"

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: docs
      - run: cargo doc --workspace --no-deps --locked --all-features
        env:
          RUSTDOCFLAGS: -D warnings
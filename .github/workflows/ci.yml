name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Lint strictness lives in the clippy job's own flags, not here: a
  # global RUSTFLAGS=-D warnings would fail test builds whenever any
  # third-party dependency emits a warning on one platform but not
  # another.

jobs:
  fmt:
    name: rustfmt (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
      - name: clippy (workspace)
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee clippy.log
          exit ${PIPESTATUS[0]}
      - name: clippy (examples)
        run: |
          cargo clippy --examples --locked -- -D warnings 2>&1 | tee clippy-ex.log
          exit ${PIPESTATUS[0]}
      - name: report clippy errors
        if: failure()
        run: |
          grep -nE "error|Caused by|failed|panic" -A 4 clippy.log | head -50 | cut -c1-380 | while IFS= read -r line; do echo "::error::$line"; done
          exit 0

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      - name: cargo test
        run: |
          cargo test --workspace --locked --all-targets 2>&1 | tee test.log
          exit ${PIPESTATUS[0]}
      - name: report test failures
        if: failure()
        shell: bash
        run: |
          grep -nE "error|Caused by|failed|panic" -A 4 test.log | head -50 | cut -c1-380 | while IFS= read -r line; do echo "::error::$line"; done
          exit 0

  determinism:
    name: determinism (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: determinism
      - name: golden PNG hash
        run: |
          set -euo pipefail
          cargo run --quiet --bin galaxy -- --seed cosmos --out /tmp/cosmos.png --format png
          echo "$(sha256sum /tmp/cosmos.png | awk '{print $1}') cosmos" > "$RUNNER_TEMP/golden.txt"
          cat "$RUNNER_TEMP/golden.txt"
      - name: golden SVG hash
        run: |
          set -euo pipefail
          cargo run --quiet --bin galaxy -- --seed cosmos --out /tmp/cosmos.svg --format svg
          echo "$(sha256sum /tmp/cosmos.svg | awk '{print $1}') cosmos.svg" >> "$RUNNER_TEMP/golden.txt"

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: seedcanvas/seed-canvas:ci
      - name: Smoke test binary inside image
        run: |
          docker run --rm seedcanvas/seed-canvas:ci --version
          docker run --rm seedcanvas/seed-canvas:ci doctor

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: docs
      - run: cargo doc --workspace --no-deps --locked --all-features
        env:
          RUSTDOCFLAGS: -D warnings
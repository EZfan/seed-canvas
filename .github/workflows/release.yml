name: release

# Manual trigger only. Enabling this on push requires release-plz to be
# configured with a token that can create release PRs (the default
# GITHUB_TOKEN works for PR creation, but crates.io publishing needs a
# CARGO_REGISTRY_TOKEN secret). Turn on push triggers once that setup
# is complete, otherwise every push fails on a half-configured pipeline.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-plz
  cancel-in-progress: false

jobs:
  release-plz:
    name: release-plz
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0
      - name: Run release-plz
        uses: release-plz/action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-file: release-plz.toml
# release-plz configuration — drives automated release PRs from `main`.
#
# See https://release-plz.dev/docs/configuration for the full schema.

[workspace]
# Check SemVer compatibility on every release PR.
semver_check = true
dependencies_update = true
changelog_update = true

# Publishing stays disabled until the first crates.io release; flip
# these to true and provide CARGO_REGISTRY_TOKEN to enable.
[[package]]
name = "seed-canvas-core"
publish = false

[[package]]
name = "seed-canvas-adapter-server"
publish = false

[[package]]
name = "seed-canvas-adapter-svg"
publish = false

[[package]]
name = "seed-canvas-storage"
publish = false

[[package]]
name = "seed-canvas-server"
publish = false

[[package]]
name = "seed-canvas-embed"
publish = false

[[package]]
name = "seed-canvas-registry"
publish = false

[[package]]
name = "seed-canvas-cli"
publish = false

[[package]]
name = "galaxy"
publish = false

[[package]]
name = "particles"
publish = false

[[package]]
name = "mandala"
publish = false